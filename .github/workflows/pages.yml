name: Deploy Site

# 把 site/ 目录发布到 GitHub Pages。
# 只在 site/ 或本工作流本身变动时触发，避免改代码就重新部署一遍。

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        # 注意：不加 enablement:true —— 用 GITHUB_TOKEN 创建 Pages 站点需要
        # 额外权限，实测会 401。仓库需在 Settings → Pages 里手动
        # 把 Source 选为「GitHub Actions」一次，之后本工作流每次都能正常部署。

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
