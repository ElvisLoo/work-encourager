name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.0.0）'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 打包 Windows 安装版与便携版
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: 列出产物
        run: dir release

      - name: 发布 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          name: 牛马鼓励器 ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          body: |
            实时看见每一秒的进账。

            **下载哪个**
            - `WorkEncourager-Setup-*.exe` — 安装版，带卸载程序，可在「应用和功能」里卸载
            - `WorkEncourager-Portable-*.exe` — 便携版，不写注册表，放 U 盘也能跑

            **本版更新**
            - 新增「今日黄历」：农历、干支、生肖、宜忌、黄道吉日、节气与节日
            - 黄历术语做了通俗化（嫁娶→结婚、开市→开张/启动新项目），并过滤掉与职场无关的条目
            - 修复跨零点夜班在凌晨金额归零的问题，现在会接着前一晚那班累计
            - 修复每月工作日填 0 时被当成「未填写」而回落到 21 天的问题
            - 安装包改为真正的 NSIS 安装器，含卸载程序与系统卸载项

            > 安装包未做代码签名，SmartScreen 提示时选「更多信息 → 仍要运行」。
          files: |
            release/WorkEncourager-Setup-*.exe
            release/WorkEncourager-Portable-*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
